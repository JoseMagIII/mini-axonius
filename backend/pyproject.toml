[project]
name = "mini-axonius"
version = "0.1.0"
description = "Asset inventory with a Claude-powered SQL agent"
authors = [
    { name = "Jose Maglaque III", email = "josemaglaqueiii@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.9.0",
    "docker>=7.2.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain>=1.4.3",
    "langchain-anthropic>=1.7.5",
    "langchain-core>=1.6.6",
    "langgraph>=1.2.12",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "sqlglot>=30.20.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: needs the Terraform Postgres and Docker containers running"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
